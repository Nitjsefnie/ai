# AI Guardrails
#
# Places the ai_guardrails filter in the request pipeline
# before routing. The filter buffers request bodies via
# StreamBuffer and will call an external NeMo Guardrails
# endpoint when request-side evaluation is enabled.
#
# Deploy a NeMo Guardrails service at the configured
# endpoint before enabling blocking behavior in production.
#
# Example request:
#
#   curl -X POST http://localhost:8080/v1/chat/completions \
#     -H "Content-Type: application/json" \
#     -d '{"model":"gpt-4o","messages":[{"role":"user","content":"Hello"}]}'

listeners:
  - name: gateway
    address: "127.0.0.1:8080"
    filter_chains: [guardrails, routing]

filter_chains:
  - name: guardrails
    filters:
      - filter: ai_guardrails
        provider:
          type: nemo
          endpoint: "http://127.0.0.1:8000/v1/guardrail/checks"
          timeout_ms: 5000
        phase:
          request: true
          response: false

  - name: routing
    filters:
      - filter: router
        routes:
          - path_prefix: "/"
            cluster: backend
      - filter: load_balancer
        clusters:
          - name: backend
            endpoints:
              - "127.0.0.1:3000"
